<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<title>{{ page.title | default: site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">📰 Nachrichten-Wiki</a>
    <span class="nav">
      <a href="{{ '/' | relative_url }}">Übersicht</a>
      <a href="{{ '/quellen.html' | relative_url }}">Quellen</a>
      <a href="{{ '/impressum.html' | relative_url }}">Impressum</a>
      <a href="{{ '/datenschutz.html' | relative_url }}">Datenschutz</a>
    </span>
  </header>
  <main class="content">
    <div class="search-box">
      <input id="search-input" type="search" placeholder="Zusammenfassungen durchsuchen …" autocomplete="off">
      <div id="search-results" hidden></div>
    </div>
{{ content }}
  </main>
  <footer>
    Automatisch erzeugt aus den Tageszusammenfassungen · Quellenangaben siehe
    <a href="https://github.com/Ubuntu51/news-wiki" rel="noopener">das Repo</a>
    <div class="kofi">
      <iframe id="kofiframe" src="https://ko-fi.com/at69104041/?hidefeed=true&widget=true&embed=true" style="border:none;width:100%;padding:4px;background:#f9f9f9;" height="200" title="Nachrichten-Wiki unterstützen"></iframe>
    </div>
  </footer>
</div>
<script>
(function () {
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var docs = [];
  fetch("{{ '/search.json' | relative_url }}?cb=" + new Date().getTime())
    .then(function (r) { return r.json(); })
    .then(function (data) { docs = data.docs || []; })
    .catch(function () { /* Suche deaktiviert, wenn search.json fehlt */ });

  function norm(s) {
    return (s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe')
      .replace(/ü/g, 'ue').replace(/ß/g, 'ss');
  }

  input.addEventListener('input', function () {
    var q = norm(input.value).trim();
    results.hidden = !q;
    if (!q) return;
    var hits = docs.filter(function (d) {
      var t = norm(d.title), s = norm(d.snippet), x = norm(d.text);
      var words = q.split(/\s+/).filter(Boolean);
      return words.every(function (w) {
        return t.indexOf(w) !== -1 || s.indexOf(w) !== -1 || x.indexOf(w) !== -1;
      });
    }).slice(0, 12);

    results.innerHTML = '';
    if (!hits.length) {
      var empty = document.createElement('div');
      empty.className = 'search-hit search-empty';
      empty.textContent = 'Keine Treffer.';
      results.appendChild(empty);
      return;
    }
    hits.forEach(function (d) {
      var a = document.createElement('a');
      a.className = 'search-hit';
      a.href = d.url;
      var strong = document.createElement('strong');
      strong.textContent = d.title;
      a.appendChild(strong);
      if (d.snippet) {
        var span = document.createElement('span');
        span.className = 'search-snippet';
        span.textContent = d.snippet;
        a.appendChild(span);
      }
      results.appendChild(a);
    });
  });
})();
</script>
</body>
</html>
