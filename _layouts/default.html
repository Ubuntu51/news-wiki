<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- XSS-Härtung: kein Inline-JS, keine externen Skripte/Bilder; Inline-Styles
     bleiben erlaubt (die generierten Seiten nutzen style="--accent:…"). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'self'">
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<title>{{ page.title | default: site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=5">
</head>
<body class="{{ page.body_class | default: '' }}">
<div class="wrap">
  <header class="top">
    <a class="brand" href="{{ '/' | relative_url }}">📰 Nachrichten-Wiki</a>
    <span class="nav">
      <a href="{{ '/' | relative_url }}">Übersicht</a>
      <a href="{{ '/quellen.html' | relative_url }}">Quellen</a>
      <a href="{{ '/podcast.html' | relative_url }}">Podcast</a>
      <a href="{{ '/impressum.html' | relative_url }}">Impressum</a>
      <a href="{{ '/datenschutz.html' | relative_url }}">Datenschutz</a>
    </span>
  </header>
  <main class="content">
    <div class="search-box">
      <input id="search-input" type="search" placeholder="Zusammenfassungen durchsuchen …" autocomplete="off" data-search-url="{{ '/search.json' | relative_url }}">
      <div id="search-results" hidden></div>
    </div>
{{ content }}
  </main>
  <footer>
    Automatisch erzeugt aus den Tageszusammenfassungen · Quellenangaben siehe
    <a href="https://github.com/Ubuntu51/news-wiki" rel="noopener">das Repo</a>
  </footer>
</div>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body>
</html>
